[project]
name = "agent-app"
version = "0.1.0"
description = "FastAPI backend for an OpenAI Agents SDK agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.141",
    "uvicorn[standard]>=0.52",
    "openai>=2.53",
    "openai-agents>=0.19.4",
    "pydantic>=2.13",
    "pydantic-settings>=2.15",
    "python-multipart>=0.0.20",  # required by FastAPI for UploadFile / form data
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=1.0",
    "httpx>=0.28",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]
